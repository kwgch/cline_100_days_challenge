<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>縦書きSNS - タテスタグラム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1 class="site-title">縦<br>ス<br>タ<br>グ<br>ラ<br>ム</h1>
        <button class="new-post-btn" id="newPostBtn">投<br>稿</button>
    </header>

    <main class="main-content">
        <div class="posts-container" id="postsContainer">
            <!-- 投稿がここに追加される -->
        </div>
    </main>

    <!-- 新規投稿モーダル -->
    <div class="modal" id="postModal">
        <div class="modal-content">
            <span class="close-btn" id="closeBtn">&times;</span>
            <h2 class="modal-title">新規投稿</h2>
            <input type="text" class="author-input" id="authorInput" placeholder="お名前">
            <textarea class="post-input" id="postInput" placeholder="今の気持ちを縦書きで..."></textarea>
            <button class="submit-btn" id="submitBtn">投稿する</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
