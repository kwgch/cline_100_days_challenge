<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星空の舞 - Beautiful Starry Dance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #0c0c2e 0%, #1a1a3e 25%, #2d1b69 50%, #4a148c 75%, #6a1b9a 100%);
            font-family: 'Arial', sans-serif;
            touch-action: none;
            user-select: none;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .title {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.8);
            font-size: clamp(2rem, 5vw, 4rem);
            text-align: center;
            z-index: 2;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            animation: glow 3s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .subtitle {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            text-align: center;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            }
            to {
                text-shadow: 0 0 30px rgba(255, 255, 255, 0.8), 0 0 40px rgba(138, 43, 226, 0.5);
            }
        }

        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 3;
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 10px 15px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .controls {
                top: 10px;
                right: 10px;
                flex-direction: column;
            }
            
            .control-btn {
                padding: 8px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="title">星空の舞</div>
    <div class="subtitle">Beautiful Starry Dance</div>
    
    <div class="controls">
        <button class="control-btn" onclick="toggleAnimation()">一時停止</button>
        <button class="control-btn" onclick="changeColors()">色変更</button>
        <button class="control-btn" onclick="resetParticles()">リセット</button>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let animationId;
        let isAnimating = true;
        let colorScheme = 0;
        
        // キャンバスサイズを設定
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // パーティクルクラス
        class Particle {
            constructor() {
                this.reset();
                this.y = Math.random() * canvas.height;
                this.opacity = Math.random();
            }
            
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = -10;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 2;
                this.speedY = Math.random() * 3 + 1;
                this.opacity = 0;
                this.life = 0;
                this.maxLife = Math.random() * 200 + 100;
                this.twinkle = Math.random() * Math.PI * 2;
            }
            
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life++;
                this.twinkle += 0.1;
                
                // 透明度の計算
                if (this.life < this.maxLife * 0.1) {
                    this.opacity = this.life / (this.maxLife * 0.1);
                } else if (this.life > this.maxLife * 0.9) {
                    this.opacity = 1 - (this.life - this.maxLife * 0.9) / (this.maxLife * 0.1);
                } else {
                    this.opacity = 0.8 + Math.sin(this.twinkle) * 0.2;
                }
                
                // 画面外に出たらリセット
                if (this.y > canvas.height + 10 || this.x < -10 || this.x > canvas.width + 10 || this.life > this.maxLife) {
                    this.reset();
                }
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                
                // 色の設定
                let colors = [
                    ['#ffffff', '#e1f5fe', '#81d4fa'],
                    ['#ffd700', '#ffecb3', '#fff176'],
                    ['#ff69b4', '#f8bbd9', '#e1bee7'],
                    ['#00ff7f', '#c8e6c9', '#a5d6a7']
                ];
                
                let currentColors = colors[colorScheme % colors.length];
                let colorIndex = Math.floor(this.size) % currentColors.length;
                
                // グラデーションの作成
                const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
                gradient.addColorStop(0, currentColors[colorIndex]);
                gradient.addColorStop(0.5, currentColors[colorIndex] + '80');
                gradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 2, 0, Math.PI * 2);
                ctx.fill();
                
                // 中心の明るい点
                ctx.fillStyle = currentColors[colorIndex];
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            }
        }
        
        // パーティクル配列
        const particles = [];
        const particleCount = Math.min(150, Math.floor(window.innerWidth * window.innerHeight / 8000));
        
        // パーティクルを初期化
        function initParticles() {
            particles.length = 0;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle());
            }
        }
        
        initParticles();
        
        // 背景のグラデーション描画
        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#0c0c2e');
            gradient.addColorStop(0.25, '#1a1a3e');
            gradient.addColorStop(0.5, '#2d1b69');
            gradient.addColorStop(0.75, '#4a148c');
            gradient.addColorStop(1, '#6a1b9a');
            
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        // 接続線の描画
        function drawConnections() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 100) {
                        ctx.globalAlpha = (100 - distance) / 100 * 0.3;
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }
            ctx.globalAlpha = 1;
        }
        
        // アニメーションループ
        function animate() {
            if (!isAnimating) return;
            
            drawBackground();
            drawConnections();
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });
            
            animationId = requestAnimationFrame(animate);
        }
        
        // コントロール関数
        function toggleAnimation() {
            isAnimating = !isAnimating;
            const btn = event.target;
            if (isAnimating) {
                btn.textContent = '一時停止';
                animate();
            } else {
                btn.textContent = '再生';
                cancelAnimationFrame(animationId);
            }
        }
        
        function changeColors() {
            colorScheme++;
        }
        
        function resetParticles() {
            initParticles();
        }
        
        // タッチイベントの無効化（スマホでの画面移動防止）
        document.addEventListener('touchstart', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });
        
        // マウス/タッチでパーティクル追加
        function addParticleAtPosition(x, y) {
            const particle = new Particle();
            particle.x = x;
            particle.y = y;
            particle.speedX = (Math.random() - 0.5) * 4;
            particle.speedY = (Math.random() - 0.5) * 4;
            particles.push(particle);
            
            // パーティクル数制限
            if (particles.length > particleCount * 2) {
                particles.shift();
            }
        }
        
        // マウスイベント
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            addParticleAtPosition(x, y);
        });
        
        // タッチイベント
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            addParticleAtPosition(x, y);
        });
        
        // アニメーション開始
        animate();
    </script>
</body>
</html>
