<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>カーソルヒーロー</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="ui">
            <div id="score">スコア: <span id="scoreValue">0</span></div>
            <div id="lives">ライフ: <span id="livesValue">3</span></div>
            <div id="level">レベル: <span id="levelValue">1</span></div>
        </div>
        <div id="startScreen" class="screen">
            <h1>カーソルヒーロー</h1>
            <p>マウスカーソルを動かして星を集めよう！</p>
            <p>赤い敵に触れるとライフが減ります</p>
            <button id="startButton">ゲーム開始</button>
        </div>
        <div id="gameOverScreen" class="screen" style="display: none;">
            <h2>ゲームオーバー</h2>
            <p>最終スコア: <span id="finalScore">0</span></p>
            <button id="restartButton">もう一度プレイ</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
