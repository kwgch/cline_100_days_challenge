<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topology Visualizer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            touch-action: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        canvas {
            display: block;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 8px;
            pointer-events: none;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 25px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .control-btn {
            width: 50px;
            height: 50px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.1);
        }
        .control-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <canvas id="glCanvas"></canvas>
    <div id="info">
        <div id="surface-name">Torus</div>
        <div>Drag: Rotate | Scroll: Zoom</div>
        <div>Touch: Transform surface</div>
    </div>
    <div id="controls">
        <button class="control-btn" id="prev-btn" title="Previous Surface">◀</button>
        <button class="control-btn" id="morph-btn" title="Morph">🔄</button>
        <button class="control-btn" id="next-btn" title="Next Surface">▶</button>
    </div>

    <script>
        // 頂点シェーダー
        const vertexShaderSource = `
            precision highp float;
            
            attribute vec3 a_position;
            attribute vec2 a_texCoord;
            
            uniform mat4 u_projectionMatrix;
            uniform mat4 u_viewMatrix;
            uniform mat4 u_modelMatrix;
            uniform float u_time;
            uniform float u_morphFactor;
            uniform int u_surfaceType;
            uniform vec2 u_touchPoint;
            uniform float u_touchIntensity;
            
            varying vec3 v_position;
            varying vec3 v_normal;
            varying vec2 v_texCoord;
            varying float v_curvature;
            
            #define PI 3.14159265359
            #define TAU 6.28318530718
            
            // トーラス
            vec3 torusPosition(float u, float v) {
                float R = 1.0; // 大半径
                float r = 0.4; // 小半径
                
                float x = (R + r * cos(v)) * cos(u);
                float y = (R + r * cos(v)) * sin(u);
                float z = r * sin(v);
                
                return vec3(x, y, z);
            }
            
            // メビウスの帯
            vec3 moebiusPosition(float u, float v) {
                float width = 0.5;
                float twist = u * 0.5;
                
                float x = (1.0 + v * width * cos(twist)) * cos(u);
                float y = (1.0 + v * width * cos(twist)) * sin(u);
                float z = v * width * sin(twist);
                
                return vec3(x, y, z);
            }
            
            // クラインの壺（figure-8 immersion）
            vec3 kleinBottlePosition(float u, float v) {
                float a = 2.0;
                
                float x, y, z;
                if (u < PI) {
                    x = a * cos(u) * (1.0 + sin(u)) + 2.0 * (1.0 - cos(u) / 2.0) * cos(u) * cos(v);
                    y = a * sin(u) + 2.0 * (1.0 - cos(u) / 2.0) * sin(u) * cos(v);
                } else {
                    x = a * cos(u) * (1.0 + sin(u)) + 2.0 * (1.0 - cos(u) / 2.0) * cos(v + PI);
                    y = a * sin(u);
                }
                z = 2.0 * (1.0 - cos(u) / 2.0) * sin(v);
                
                return vec3(x * 0.3, y * 0.3, z * 0.3);
            }
            
            // ボーイ曲面
            vec3 boySurfacePosition(float u, float v) {
                float a = cos(v) * sin(u);
                float b = sin(v) * sin(u);
                float c = cos(u);
                
                float x = (sqrt(2.0) * a * a * b + b * c * (2.0 - sqrt(2.0) * c)) / (a * a + b * b);
                float y = (sqrt(2.0) * a * b * b + a * c * (2.0 - sqrt(2.0) * c)) / (a * a + b * b);
                float z = (b * (a * a + b * b - sqrt(2.0) * a * c)) / (a * a + b * b);
                
                return vec3(x, y, z) * 0.8;
            }
            
            // ローマン曲面
            vec3 romanSurfacePosition(float u, float v) {
                float x = cos(u) * cos(v) * sin(v);
                float y = sin(u) * cos(v) * sin(v);
                float z = cos(u) * sin(u) * cos(v) * cos(v);
                
                return vec3(x, y, z) * 2.0;
            }
            
            // 法線の計算（数値微分）
            vec3 calculateNormal(float u, float v, int surfaceType) {
                float h = 0.01;
                vec3 p0, pu, pv;
                
                if (surfaceType == 0) {
                    p0 = torusPosition(u, v);
                    pu = torusPosition(u + h, v) - p0;
                    pv = torusPosition(u, v + h) - p0;
                } else if (surfaceType == 1) {
                    p0 = moebiusPosition(u, v);
                    pu = moebiusPosition(u + h, v) - p0;
                    pv = moebiusPosition(u, v + h) - p0;
                } else if (surfaceType == 2) {
                    p0 = kleinBottlePosition(u, v);
                    pu = kleinBottlePosition(u + h, v) - p0;
                    pv = kleinBottlePosition(u, v + h) - p0;
                } else if (surfaceType == 3) {
                    p0 = boySurfacePosition(u, v);
                    pu = boySurfacePosition(u + h, v) - p0;
                    pv = boySurfacePosition(u, v + h) - p0;
                } else {
                    p0 = romanSurfacePosition(u, v);
                    pu = romanSurfacePosition(u + h, v) - p0;
                    pv = romanSurfacePosition(u, v + h) - p0;
                }
                
                return normalize(cross(pu, pv));
            }
            
            // ガウス曲率の近似計算
            float calculateCurvature(float u, float v, int surfaceType) {
                float h = 0.01;
                vec3 p = surfaceType == 0 ? torusPosition(u, v) :
                         surfaceType == 1 ? moebiusPosition(u, v) :
                         surfaceType == 2 ? kleinBottlePosition(u, v) :
                         surfaceType == 3 ? boySurfacePosition(u, v) :
                         romanSurfacePosition(u, v);
                         
                vec3 pu = normalize(
                    (surfaceType == 0 ? torusPosition(u + h, v) :
                     surfaceType == 1 ? moebiusPosition(u + h, v) :
                     surfaceType == 2 ? kleinBottlePosition(u + h, v) :
                     surfaceType == 3 ? boySurfacePosition(u + h, v) :
                     romanSurfacePosition(u + h, v)) - p
                );
                
                vec3 pv = normalize(
                    (surfaceType == 0 ? torusPosition(u, v + h) :
                     surfaceType == 1 ? moebiusPosition(u, v + h) :
                     surfaceType == 2 ? kleinBottlePosition(u, v + h) :
                     surfaceType == 3 ? boySurfacePosition(u, v + h) :
                     romanSurfacePosition(u, v + h)) - p
                );
                
                return dot(cross(pu, pv), p) / length(p);
            }
            
            // 位相的変形
            vec3 topologicalDeformation(vec3 pos, vec2 uv) {
                // タッチポイントからの距離
                float dist = distance(uv, u_touchPoint);
                float influence = exp(-dist * dist * 5.0) * u_touchIntensity;
                
                // ツイスト変形
                float angle = influence * PI;
                mat3 rot = mat3(
                    cos(angle), -sin(angle), 0.0,
                    sin(angle), cos(angle), 0.0,
                    0.0, 0.0, 1.0
                );
                
                // 局所的な伸縮
                vec3 deformed = pos * (1.0 + influence * 0.5 * sin(u_time * 2.0));
                
                // 波動
                deformed += normalize(pos) * sin(dist * 10.0 - u_time * 3.0) * influence * 0.1;
                
                return rot * deformed;
            }
            
            void main() {
                float u = a_texCoord.x * TAU;
                float v = a_texCoord.y * TAU;
                
                // 現在の曲面の位置
                vec3 pos1;
                if (u_surfaceType == 0) pos1 = torusPosition(u, v);
                else if (u_surfaceType == 1) pos1 = moebiusPosition(u, v - PI);
                else if (u_surfaceType == 2) pos1 = kleinBottlePosition(u, v);
                else if (u_surfaceType == 3) pos1 = boySurfacePosition(u, v);
                else pos1 = romanSurfacePosition(u, v);
                
                // 次の曲面の位置
                int nextType = int(mod(float(u_surfaceType + 1), 5.0));
                vec3 pos2;
                if (nextType == 0) pos2 = torusPosition(u, v);
                else if (nextType == 1) pos2 = moebiusPosition(u, v - PI);
                else if (nextType == 2) pos2 = kleinBottlePosition(u, v);
                else if (nextType == 3) pos2 = boySurfacePosition(u, v);
                else pos2 = romanSurfacePosition(u, v);
                
                // モーフィング
                vec3 position = mix(pos1, pos2, u_morphFactor);
                
                // 位相的変形を適用
                position = topologicalDeformation(position, a_texCoord);
                
                // アニメーション
                float wave = sin(u * 3.0 + u_time) * sin(v * 2.0 + u_time * 0.7) * 0.05;
                position += normalize(position) * wave;
                
                // 法線とガウス曲率を計算
                v_normal = calculateNormal(u, v, u_surfaceType);
                v_curvature = calculateCurvature(u, v, u_surfaceType);
                
                v_position = position;
                v_texCoord = a_texCoord;
                
                gl_Position = u_projectionMatrix * u_viewMatrix * u_modelMatrix * vec4(position, 1.0);
            }
        `;

        // フラグメントシェーダー
        const fragmentShaderSource = `
            precision highp float;
            
            uniform float u_time;
            uniform vec3 u_lightDir;
            uniform vec3 u_viewPos;
            uniform float u_morphFactor;
            
            varying vec3 v_position;
            varying vec3 v_normal;
            varying vec2 v_texCoord;
            varying float v_curvature;
            
            #define PI 3.14159265359
            
            // HSVからRGBへの変換
            vec3 hsv2rgb(vec3 c) {
                vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
            }
            
            // 曲率に基づく色
            vec3 curvatureColor(float k) {
                // ガウス曲率による色分け
                float hue;
                if (k > 0.0) {
                    // 正の曲率（球面的）：赤〜黄
                    hue = mix(0.0, 0.16, clamp(k * 2.0, 0.0, 1.0));
                } else {
                    // 負の曲率（双曲的）：青〜紫
                    hue = mix(0.55, 0.75, clamp(-k * 2.0, 0.0, 1.0));
                }
                
                return hsv2rgb(vec3(hue, 0.8, 0.9));
            }
            
            // パラメトリックグリッド
            float parametricGrid(vec2 uv) {
                vec2 grid = fract(uv * 20.0) - 0.5;
                float lines = 1.0 - smoothstep(0.0, 0.02, min(abs(grid.x), abs(grid.y)));
                return lines * 0.3;
            }
            
            // フレネル効果
            float fresnel(vec3 normal, vec3 viewDir) {
                return pow(1.0 - abs(dot(normal, viewDir)), 2.0);
            }
            
            void main() {
                vec3 normal = normalize(v_normal);
                vec3 viewDir = normalize(u_viewPos - v_position);
                
                // 基本色（曲率ベース）
                vec3 baseColor = curvatureColor(v_curvature);
                
                // パラメトリック座標による色変調
                vec3 paramColor = vec3(
                    sin(v_texCoord.x * PI * 4.0 + u_time * 0.5) * 0.5 + 0.5,
                    cos(v_texCoord.y * PI * 4.0 + u_time * 0.3) * 0.5 + 0.5,
                    sin((v_texCoord.x + v_texCoord.y) * PI * 2.0) * 0.5 + 0.5
                );
                
                // モーフィング中は虹色効果
                if (u_morphFactor > 0.01) {
                    float morphHue = mod(u_time * 0.1 + length(v_position) * 0.3, 1.0);
                    vec3 morphColor = hsv2rgb(vec3(morphHue, 0.7, 1.0));
                    baseColor = mix(baseColor, morphColor, u_morphFactor);
                }
                
                // ライティング
                float diff = max(dot(normal, normalize(u_lightDir)), 0.0);
                vec3 halfDir = normalize(u_lightDir + viewDir);
                float spec = pow(max(dot(normal, halfDir), 0.0), 32.0);
                
                // 最終色の合成
                vec3 color = baseColor * (0.3 + 0.7 * diff);
                color += vec3(1.0) * spec * 0.5;
                
                // グリッドオーバーレイ
                float grid = parametricGrid(v_texCoord);
                color = mix(color, vec3(1.0), grid * (1.0 - u_morphFactor));
                
                // フレネル効果でエッジを強調
                float rim = fresnel(normal, viewDir);
                color += vec3(0.3, 0.5, 0.8) * rim * 0.5;
                
                // トーンマッピング
                color = color / (color + vec3(1.0));
                color = pow(color, vec3(0.45));
                
                gl_FragColor = vec4(color, 1.0);
            }
        `;

        // 行列演算
        function createProjectionMatrix(fov, aspect, near, far) {
            const f = 1.0 / Math.tan(fov / 2);
            const rangeInv = 1 / (near - far);
            
            return new Float32Array([
                f / aspect, 0, 0, 0,
                0, f, 0, 0,
                0, 0, (near + far) * rangeInv, -1,
                0, 0, near * far * rangeInv * 2, 0
            ]);
        }
        
        function createViewMatrix(eye, center, up) {
            const zAxis = normalize(subtract(eye, center));
            const xAxis = normalize(cross(up, zAxis));
            const yAxis = normalize(cross(zAxis, xAxis));
            
            return new Float32Array([
                xAxis[0], xAxis[1], xAxis[2], 0,
                yAxis[0], yAxis[1], yAxis[2], 0,
                zAxis[0], zAxis[1], zAxis[2], 0,
                -dot(xAxis, eye), -dot(yAxis, eye), -dot(zAxis, eye), 1
            ]);
        }
        
        function createModelMatrix(rotX, rotY, scale) {
            const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
            const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
            
            return new Float32Array([
                cosY * scale, 0, sinY * scale, 0,
                sinX * sinY * scale, cosX * scale, -sinX * cosY * scale, 0,
                -cosX * sinY * scale, sinX * scale, cosX * cosY * scale, 0,
                0, 0, 0, 1
            ]);
        }
        
        // ベクトル演算
        function normalize(v) {
            const len = Math.sqrt(v[0] * v[0] + v[1] * v[1] + v[2] * v[2]);
            return [v[0] / len, v[1] / len, v[2] / len];
        }
        
        function subtract(a, b) {
            return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
        }
        
        function cross(a, b) {
            return [
                a[1] * b[2] - a[2] * b[1],
                a[2] * b[0] - a[0] * b[2],
                a[0] * b[1] - a[1] * b[0]
            ];
        }
        
        function dot(a, b) {
            return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
        }

        // シェーダーコンパイル
        function createShader(gl, type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compilation error:', gl.getShaderInfoLog(shader));
                gl.deleteShader(shader);
                return null;
            }
            
            return shader;
        }

        // プログラム作成
        function createProgram(gl, vertexShader, fragmentShader) {
            const program = gl.createProgram();
            gl.attachShader(program, vertexShader);
            gl.attachShader(program, fragmentShader);
            gl.linkProgram(program);
            
            if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
                console.error('Program link error:', gl.getProgramInfoLog(program));
                gl.deleteProgram(program);
                return null;
            }
            
            return program;
        }

        // メッシュ生成
        function createParametricSurface(resolution) {
            const vertices = [];
            const texCoords = [];
            const indices = [];
            
            for (let i = 0; i <= resolution; i++) {
                for (let j = 0; j <= resolution; j++) {
                    const u = i / resolution;
                    const v = j / resolution;
                    
                    // 仮の頂点位置（シェーダーで実際の位置を計算）
                    vertices.push(0, 0, 0);
                    texCoords.push(u, v);
                    
                    if (i < resolution && j < resolution) {
                        const idx = i * (resolution + 1) + j;
                        indices.push(
                            idx, idx + 1, idx + resolution + 1,
                            idx + 1, idx + resolution + 2, idx + resolution + 1
                        );
                    }
                }
            }
            
            return {
                vertices: new Float32Array(vertices),
                texCoords: new Float32Array(texCoords),
                indices: new Uint16Array(indices)
            };
        }

        // メイン
        function main() {
            const canvas = document.getElementById('glCanvas');
            const gl = canvas.getContext('webgl');
            
            if (!gl) {
                alert('WebGL not supported');
                return;
            }

            // 拡張機能の有効化
            const ext = gl.getExtension('OES_element_index_uint');

            // リサイズ
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                gl.viewport(0, 0, canvas.width, canvas.height);
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // シェーダー作成
            const vertexShader = createShader(gl, gl.VERTEX_SHADER, vertexShaderSource);
            const fragmentShader = createShader(gl, gl.FRAGMENT_SHADER, fragmentShaderSource);
            const program = createProgram(gl, vertexShader, fragmentShader);

            // 属性とユニフォーム
            const positionLocation = gl.getAttribLocation(program, 'a_position');
            const texCoordLocation = gl.getAttribLocation(program, 'a_texCoord');
            
            const projectionMatrixLocation = gl.getUniformLocation(program, 'u_projectionMatrix');
            const viewMatrixLocation = gl.getUniformLocation(program, 'u_viewMatrix');
            const modelMatrixLocation = gl.getUniformLocation(program, 'u_modelMatrix');
            const timeLocation = gl.getUniformLocation(program, 'u_time');
            const morphFactorLocation = gl.getUniformLocation(program, 'u_morphFactor');
            const surfaceTypeLocation = gl.getUniformLocation(program, 'u_surfaceType');
            const lightDirLocation = gl.getUniformLocation(program, 'u_lightDir');
            const viewPosLocation = gl.getUniformLocation(program, 'u_viewPos');
            const touchPointLocation = gl.getUniformLocation(program, 'u_touchPoint');
            const touchIntensityLocation = gl.getUniformLocation(program, 'u_touchIntensity');

            // メッシュ生成
            const mesh = createParametricSurface(64);

            // バッファ作成
            const positionBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, mesh.vertices, gl.STATIC_DRAW);

            const texCoordBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, mesh.texCoords, gl.STATIC_DRAW);

            const indexBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.indices, gl.STATIC_DRAW);

            // 状態
            let rotationX = 0.3;
            let rotationY = 0;
            let scale = 1;
            let isDragging = false;
            let lastX = 0;
            let lastY = 0;
            let morphFactor = 0;
            let surfaceType = 0;
            let targetSurfaceType = 0;
            let isAnimating = false;
            let touchPoint = [0.5, 0.5];
            let touchIntensity = 0;
            
            const surfaceNames = ['Torus', 'Möbius Strip', 'Klein Bottle', 'Boy Surface', 'Roman Surface'];

            // イベントハンドラ
            canvas.addEventListener('mousedown', (e) => {
                isDragging = true;
                lastX = e.clientX;
                lastY = e.clientY;
            });

            canvas.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    const deltaX = e.clientX - lastX;
                    const deltaY = e.clientY - lastY;
                    
                    rotationY += deltaX * 0.01;
                    rotationX += deltaY * 0.01;
                    
                    lastX = e.clientX;
                    lastY = e.clientY;
                }
            });

            canvas.addEventListener('mouseup', () => {
                isDragging = false;
            });

            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                scale *= e.deltaY > 0 ? 0.9 : 1.1;
                scale = Math.max(0.1, Math.min(scale, 5));
            });

            // タッチイベント
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (e.touches.length === 1) {
                    const touch = e.touches[0];
                    lastX = touch.clientX;
                    lastY = touch.clientY;
                    isDragging = true;
                    
                    // タッチ位置を正規化
                    touchPoint = [
                        touch.clientX / canvas.width,
                        touch.clientY / canvas.height
                    ];
                    touchIntensity = 1;
                }
            });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (e.touches.length === 1 && isDragging) {
                    const touch = e.touches[0];
                    const deltaX = touch.clientX - lastX;
                    const deltaY = touch.clientY - lastY;
                    
                    rotationY += deltaX * 0.01;
                    rotationX += deltaY * 0.01;
                    
                    lastX = touch.clientX;
                    lastY = touch.clientY;
                    
                    touchPoint = [
                        touch.clientX / canvas.width,
                        touch.clientY / canvas.height
                    ];
                }
            });

            canvas.addEventListener('touchend', () => {
                isDragging = false;
                touchIntensity = 0;
            });

            // コントロールボタン
            document.getElementById('prev-btn').addEventListener('click', () => {
                targetSurfaceType = (surfaceType - 1 + 5) % 5;
                isAnimating = true;
            });

            document.getElementById('next-btn').addEventListener('click', () => {
                targetSurfaceType = (surfaceType + 1) % 5;
                isAnimating = true;
            });

            document.getElementById('morph-btn').addEventListener('click', () => {
                targetSurfaceType = (surfaceType + 1) % 5;
                isAnimating = true;
            });

            const startTime = Date.now();

            // 描画ループ
            function draw() {
                const time = (Date.now() - startTime) / 1000;

                // モーフィングアニメーション
                if (isAnimating) {
                    morphFactor += 0.02;
                    if (morphFactor >= 1) {
                        morphFactor = 0;
                        surfaceType = targetSurfaceType;
                        isAnimating = false;
                        document.getElementById('surface-name').textContent = surfaceNames[surfaceType];
                    }
                }

                // タッチ強度の減衰
                touchIntensity *= 0.95;

                // 自動回転
                if (!isDragging) {
                    rotationY += 0.003;
                }

                // レンダリング設定
                gl.enable(gl.DEPTH_TEST);
                gl.enable(gl.CULL_FACE);
                gl.cullFace(gl.BACK);
                
                gl.clearColor(0.02, 0.02, 0.05, 1.0);
                gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

                gl.useProgram(program);

                // 行列の設定
                const aspect = canvas.width / canvas.height;
                const projectionMatrix = createProjectionMatrix(Math.PI / 4, aspect, 0.1, 100);
                const viewMatrix = createViewMatrix([0, 0, 5], [0, 0, 0], [0, 1, 0]);
                const modelMatrix = createModelMatrix(rotationX, rotationY, scale);

                gl.uniformMatrix4fv(projectionMatrixLocation, false, projectionMatrix);
                gl.uniformMatrix4fv(viewMatrixLocation, false, viewMatrix);
                gl.uniformMatrix4fv(modelMatrixLocation, false, modelMatrix);

                // ユニフォームの設定
                gl.uniform1f(timeLocation, time);
                gl.uniform1f(morphFactorLocation, morphFactor);
                gl.uniform1i(surfaceTypeLocation, surfaceType);
                gl.uniform3f(lightDirLocation, 0.5, 0.7, 0.3);
                gl.uniform3f(viewPosLocation, 0, 0, 5);
                gl.uniform2fv(touchPointLocation, touchPoint);
                gl.uniform1f(touchIntensityLocation, touchIntensity);

                // 頂点属性の設定
                gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
                gl.enableVertexAttribArray(positionLocation);
                gl.vertexAttribPointer(positionLocation, 3, gl.FLOAT, false, 0, 0);

                gl.bindBuffer(gl.ARRAY_BUFFER, texCoordBuffer);
                gl.enableVertexAttribArray(texCoordLocation);
                gl.vertexAttribPointer(texCoordLocation, 2, gl.FLOAT, false, 0, 0);

                // 描画
                gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
                gl.drawElements(gl.TRIANGLES, mesh.indices.length, gl.UNSIGNED_SHORT, 0);

                requestAnimationFrame(draw);
            }

            draw();
        }

        window.addEventListener('load', main);
    </script>
</body>
