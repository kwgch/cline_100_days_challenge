<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Password Strength Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Password Strength Visualizer</h1>
        
        <div class="input-section">
            <div class="password-container">
                <input type="password" id="passwordInput" placeholder="パスワードを入力してください" autocomplete="off">
                <button class="toggle-visibility" id="togglePassword" aria-label="パスワード表示切替">
                    <svg class="eye-icon" viewBox="0 0 24 24">
                        <path class="eye-open" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        <path class="eye-closed" d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
                    </svg>
                </button>
            </div>
            
            <div class="strength-meter">
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill"></div>
                </div>
                <div class="strength-label" id="strengthLabel">強度: なし</div>
            </div>
        </div>

        <div class="visualization-section">
            <canvas id="visualCanvas"></canvas>
        </div>

        <div class="criteria-section">
            <h2>パスワード要件</h2>
            <ul class="criteria-list">
                <li class="criterion" data-criterion="length">
                    <span class="check-icon">✗</span>
                    <span class="criterion-text">8文字以上</span>
                </li>
                <li class="criterion" data-criterion="uppercase">
                    <span class="check-icon">✗</span>
                    <span class="criterion-text">大文字を含む</span>
                </li>
                <li class="criterion" data-criterion="lowercase">
                    <span class="check-icon">✗</span>
                    <span class="criterion-text">小文字を含む</span>
                </li>
                <li class="criterion" data-criterion="numbers">
                    <span class="check-icon">✗</span>
                    <span class="criterion-text">数字を含む</span>
                </li>
                <li class="criterion" data-criterion="special">
                    <span class="check-icon">✗</span>
                    <span class="criterion-text">特殊文字を含む (!@#$%^&*)</span>
                </li>
            </ul>
        </div>

        <div class="tips-section">
            <h3>セキュリティのヒント</h3>
            <p id="securityTip">強力なパスワードを作成してアカウントを保護しましょう。</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
