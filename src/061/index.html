<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>色彩感覚テストゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🎨 色彩感覚テスト</h1>
            <div class="game-info">
                <div class="score">スコア: <span id="score">0</span></div>
                <div class="level">レベル: <span id="level">1</span></div>
                <div class="lives">❤️ <span id="lives">3</span></div>
            </div>
        </header>

        <main>
            <div class="game-area">
                <div class="instructions">
                    <p>他と違う色のタイルを見つけてタップしてください！</p>
                </div>
                
                <div class="grid-container">
                    <div id="color-grid" class="color-grid">
                        <!-- グリッドはJavaScriptで生成 -->
                    </div>
                </div>

                <div class="game-controls">
                    <button id="start-btn" class="btn primary">ゲーム開始</button>
                    <button id="restart-btn" class="btn secondary" style="display: none;">リスタート</button>
                </div>

                <div id="game-over" class="game-over" style="display: none;">
                    <h2>ゲームオーバー！</h2>
                    <p>最終スコア: <span id="final-score">0</span></p>
                    <p>到達レベル: <span id="final-level">1</span></p>
                </div>

                <div id="level-up" class="level-up" style="display: none;">
                    <h3>🎉 レベルアップ！</h3>
                    <p>レベル <span id="new-level">2</span> に到達しました！</p>
                </div>
            </div>
        </main>

        <footer>
            <div class="tips">
                <h3>💡 コツ</h3>
                <ul>
                    <li>画面を少し離して見ると違いが分かりやすくなります</li>
                    <li>レベルが上がると色の差が小さくなります</li>
                    <li>間違えると❤️が減ります（3回まで）</li>
                </ul>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
